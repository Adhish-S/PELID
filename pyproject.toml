[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pelid"
version = "0.1.0"
description = "Open-source AI decision proxy that intercepts lightweight LLM calls and resolves them locally."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "onnxruntime>=1.18.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0.0",
    "tiktoken>=0.7.0",
    "langdetect>=1.0.9",
    "python-dotenv>=1.0.0",
    "laya>=0.3.20",
    "transformers>=4.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]
