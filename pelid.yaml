# Pelid Multi-Domain Configuration Manifest
# Define your domain, custom intents, declarative business actions, and safety rules.

active_domain: ecommerce

domains:
  ecommerce:
    name: "E-Commerce & Retail Logistics"
    description: "Post-purchase customer support, parcel tracking, returns, and billing"
    intents:
      safe:
        - order_status
        - order_delayed_or_missing
        - wrong_or_defective_item
        - return_or_exchange
        - payment_failure
        - invoice_or_receipt
        - login_or_password_issue
        - how_to_question
        - pricing_or_plan_question
        - feature_request_or_feedback
        - general_chitchat_or_faq
      destructive:
        - cancel_order
        - cancel_subscription
        - refund_request
        - billing_dispute
        - delete_account
        - shipping_address_change

    # Declarative Business Actions (Path A Resolution)
    # Eliminates hardcoded Python strings. Executes REST APIs / Webhooks or falls back to local sandbox.
    actions:
      order_status:
        slots: ["order_id"]
        prompt_for_slots:
          en: "I would be glad to check your order status! Could you please provide your Order ID or tracking number?"
          hi: "Main aapke order ka status check karne mein madad kar sakta hoon. Kripya apna Order ID batayein?"
          ml: "Ningalude order status check cheyyam! Dayavayi Order ID athallekil tracking number share cheyyamo?"
        action:
          type: "http"
          method: "GET"
          url: "https://api.yourstore.com/v1/orders/{order_id}"
          headers:
            Authorization: "Bearer ${STORE_API_KEY}"
          timeout_ms: 250
          fallback_to_mock: true
        response:
          en: "Order {order_id} ({item}) is currently '{status}' via {courier} (Tracking #{tracking_num}). Estimated delivery: {eta}."
          hi: "Aapka Order {order_id} ({item}) filhaal '{status}' hai via {courier} (Tracking #{tracking_num}). Expected delivery: {eta}."
          ml: "Ningalude Order {order_id} ({item}) ippo '{status}' aayi irikkukayanu via {courier} (Tracking #{tracking_num}). Expected delivery: {eta}."
        not_found:
          en: "I couldn't find an order with ID {order_id}. Please verify the number from your confirmation email or SMS."
          hi: "Humein {order_id} se koi order nahi mila. Kripya apna order number confirmation SMS/email se check karein."
          ml: "{order_id} vechu oru order-um kandethan kazhinjilla. Dayavayi confirmation SMS/email-il ninnu verify cheyyamo?"

      order_delayed_or_missing:
        slots: ["order_id"]
        prompt_for_slots:
          en: "We sincerely apologize for the delay. Please share your Order ID and we will trace it immediately with logistics."
          hi: "Delivery delay ke liye humein khed hai. Kripya apna Order ID share karein, hum turant logistics team se track karenge."
          ml: "Delivery delay aayathil kshamikkuka. Dayavayi Order ID share cheyyamo? Njangal udan thanne trace cheyyaam."
        action:
          type: "http"
          method: "GET"
          url: "https://api.yourstore.com/v1/orders/{order_id}/trace"
          timeout_ms: 250
          fallback_to_mock: true
        response:
          en: "Your delayed package for Order {order_id} ({item}) has been expedited with {courier}. Updated ETA: {eta}."
          hi: "Aapke Order {order_id} ({item}) ka shipment {courier} ke saath expedite kar diya gaya hai. Updated ETA: {eta}."
          ml: "Ningalude Order {order_id} ({item}) {courier} vazhi expedite cheythittundu. Puthukkiya ETA: {eta}."
        not_found:
          en: "I couldn't find an order with ID {order_id}. Please verify the number from your confirmation email or SMS."
          hi: "Humein {order_id} se koi order nahi mila. Kripya apna order number check karein."
          ml: "{order_id} vechu oru order-um kandethan kazhinjilla. Dayavayi verify cheyyamo?"

      invoice_or_receipt:
        slots: []
        action:
          type: "mock"
        response:
          en: "You can download your official GST tax invoice directly from the 'Orders' section in your account."
          hi: "Aap apna formal GST invoice account ke 'Orders' section se direct download kar sakte hain."
          ml: "Ningalude official GST tax invoice account-ile 'Orders' section-il ninnu download cheyyaan kazhiyum."

  food_delivery:
    name: "On-Demand Food & Quick-Commerce"
    description: "Real-time delivery partner tracking, live kitchen prep, spills, and cold items"
    intents:
      safe:
        - live_driver_location
        - restaurant_prep_delay
        - missing_condiment_or_sauce
        - food_temperature_issue
        - packaging_damaged_spilled
        - delivery_partner_unreachable
        - allergies_or_dietary_query
        - apply_promo_code
        - tip_delivery_executive
      destructive:
        - cancel_live_kitchen_order
        - food_poisoning_critical_escalation
        - full_order_refund
        - chargeback_dispute

  b2b_manufacturing:
    name: "Industrial B2B & Supply Chain"
    description: "Purchase orders, raw material inventory, spec sheets, and supplier RMA"
    intents:
      safe:
        - purchase_order_status
        - raw_material_lead_time
        - download_cad_spec_sheet
        - compliance_certificate_request
        - warehouse_stock_inquiry
        - minimum_order_quantity_check
      destructive:
        - cancel_bulk_procurement_po
        - warranty_supplier_rma
        - factory_downtime_critical_incident
        - legal_contract_termination

# ─── Universal Zero-Code Semantic Knowledge Base (FAQ Store) ─────────
# Any company can add Q&A pairs here. Pelid embeds and matches them in <5ms
# using ModernBERT, resolving them locally on Path A for $0.00 with 0% hallucination.
faqs:
  - id: "shipping_coverage_bangalore"
    category: "logistics"
    question: "Do you deliver to Bangalore?"
    variations:
      - "Is delivery available in Bengaluru?"
      - "Can you ship packages to Bangalore?"
      - "Bangalore delivery available?"
    answer: "Yes! We provide same-day and next-day delivery across Bangalore and major metropolitan cities in India."

  - id: "refund_policy_window"
    category: "billing"
    question: "What is your refund policy?"
    variations:
      - "How do refunds work?"
      - "Within how many days can I claim a refund?"
      - "What is your return and refund window?"
    answer: "We offer a 100% money-back refund within 7 days of delivery. Funds are credited to your original payment method in 3–5 business days."

  - id: "accepted_payment_methods"
    category: "billing"
    question: "What payment methods do you accept?"
    variations:
      - "Can I pay using UPI, cards, or Cash on Delivery?"
      - "Do you accept Google Pay or PhonePe?"
      - "Supported payment modes?"
    answer: "We accept all major UPI apps (Google Pay, PhonePe, Paytm), Credit/Debit cards (Visa, Mastercard, RuPay), Net Banking, and Cash on Delivery (COD)."

  - id: "international_shipping_policy"
    category: "logistics"
    question: "Do you ship internationally outside India?"
    variations:
      - "Can I place an order for delivery to the US or UK?"
      - "Do you deliver overseas?"
    answer: "Currently, we only deliver across India. We are working on international delivery and will announce it soon!"

