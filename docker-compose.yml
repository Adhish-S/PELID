version: '3.8'

# ─────────────────────────────────────────────────────────────
# Pelid AI Decision Gateway — Compose Specification
# 
# Services:
# 1. pelid-gateway: The high-speed ModernBERT / mmBERT decision proxy (Port 8080)
# 2. caddy-proxy: Production reverse proxy with automatic HTTPS & TLS (Ports 80 & 443)
# 
# Usage:
#   # Local development (HTTPS on localhost):
#   docker compose up -d
# 
#   # Production deployment with real domain:
#   PELID_DOMAIN=api.yourcompany.com docker compose up -d
# ─────────────────────────────────────────────────────────────

services:
  pelid-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pelid-gateway
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - UPSTREAM_MODEL=${UPSTREAM_MODEL:-gemini-3.5-flash-lite}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.70}
      - CONTEXT_BUDGET_TOKENS=${CONTEXT_BUDGET_TOKENS:-450}
      - ENABLE_INJECTION_SHIELD=${ENABLE_INJECTION_SHIELD:-true}
      - PELID_PROXY_API_KEY=${PELID_PROXY_API_KEY:-}
      - SHADOW_MODE=${SHADOW_MODE:-false}
    volumes:
      - pelid-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s

  caddy-proxy:
    image: caddy:2-alpine
    container_name: pelid-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # Standard HTTP (auto-redirects to HTTPS)
      - "443:443"   # Encrypted HTTPS (TLS)
    environment:
      - PELID_DOMAIN=${PELID_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pelid-gateway

volumes:
  pelid-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
